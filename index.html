<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo192.png" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d111d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AMPLIFY - Liquid Glass Music Player</title>
    <!-- Google Fonts: Cinzel, Outfit & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Suppress Netlify HUD & Deploy Preview Drawer from covering mobile UI -->
    <style>
      #nl-badge-frame,
      iframe[id*="nl-badge"],
      iframe[title*="Powered by Netlify"],
      iframe[title*="Netlify"],
      [data-netlify-hud],
      #netlify-badge,
      .netlify-badge {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        opacity: 0 !important;
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
        z-index: -99999 !important;
      }
    </style>
    <script>
      (function() {
        const removeNetlifyWidgets = () => {
          const targets = document.querySelectorAll(
            '#nl-badge-frame, iframe[title*="Powered by Netlify"], iframe[id*="nl-badge"], script[src*="/.netlify/scripts/hud"]'
          );
          targets.forEach(el => el.remove());
        };
        removeNetlifyWidgets();
        if (typeof MutationObserver !== 'undefined') {
          new MutationObserver(removeNetlifyWidgets).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
